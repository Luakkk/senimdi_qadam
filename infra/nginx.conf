# ═══════════════════════════════════════════════════════════════════════════════
# SenimdiQAdam — Nginx production config
# ═══════════════════════════════════════════════════════════════════════════════
#
# Использование:
#   1. Установить certbot: apt install certbot python3-certbot-nginx
#   2. Получить SSL: certbot --nginx -d api.senimdi-qadam.kz
#   3. Certbot автоматически обновит этот файл с SSL блоком
#
# Nginx запускается через docker-compose поверх gateway-api (порт 3000).
# Он обеспечивает:
#   - SSL-терминацию (HTTPS → HTTP внутри Docker)
#   - WebSocket проксирование (Upgrade header для Socket.IO)
#   - GZIP сжатие
#   - Rate limiting на уровне Nginx
#   - Security headers
# ═══════════════════════════════════════════════════════════════════════════════

# Зона rate limiting: 10 req/sec на IP для API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=2r/s;

upstream gateway {
    server gateway-api:3000;
    keepalive 32;
}

# ── HTTP → HTTPS редирект ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.senimdi-qadam.kz;

    # Let's Encrypt challenge (certbot использует этот путь)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS сервер ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.senimdi-qadam.kz;

    # ── SSL (certbot заполнит эти пути автоматически) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.senimdi-qadam.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.senimdi-qadam.kz/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS — браузер запомнит что сайт только HTTPS (1 год)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── GZIP ──────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ── Client upload limits ──────────────────────────────────────────────────
    client_max_body_size 30M;    # для STT аудио файлов (max 25MB + overhead)

    # ── Auth endpoints: строгий rate limit (защита от брутфорса) ─────────────
    location ~ ^/api/auth/(login|register|forgot-password) {
        limit_req zone=auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://gateway;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── WebSocket: Socket.IO для такси (taxi-svc → /taxi namespace) ───────────
    location /socket.io/ {
        proxy_pass http://gateway;

        # ОБЯЗАТЕЛЬНО для WebSocket — без этого соединение не апгрейдится
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Долгое соединение для WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Admin panel (только для внутренних IP или VPN) ────────────────────────
    location /admin {
        # Ограничиваем доступ к AdminJS — только с известных IP
        # Раскомментируй и укажи свои IP:
        # allow 192.168.1.0/24;  # офисная сеть
        # allow 77.88.1.1;       # VPN
        # deny all;

        proxy_pass http://gateway;
        include /etc/nginx/conf.d/proxy_params.conf;
    }

    # ── Все остальные API запросы ─────────────────────────────────────────────
    location / {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://gateway;
        include /etc/nginx/conf.d/proxy_params.conf;
    }
}
