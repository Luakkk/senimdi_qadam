# ═══════════════════════════════════════════════════════════════════════════════
# SenimdiQAdam — PRODUCTION Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file OVERRIDES docker-compose.yml with production settings:
#   - restart: always (not unless-stopped)
#   - mem_limit + cpus resource constraints
#   - env_file: ../infra/.env for secrets
#   - logging driver (json-file with rotation)
#   - No port exposure for internal services (only gateway + minio exposed)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── Nginx (SSL termination + WebSocket proxy) ──────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: senimdi_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx_proxy_params.conf:/etc/nginx/conf.d/proxy_params.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro          # SSL сертификаты
      - /var/www/certbot:/var/www/certbot:ro           # Let's Encrypt ACME challenge
    networks:
      - backend
    depends_on:
      - gateway-api
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Databases ─────────────────────────────────────────────────────────────

  core_db:
    restart: always
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  taxi_db:
    restart: always
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  ai_db:
    restart: always
    mem_limit: 1g
    cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: always
    mem_limit: 256m
    cpus: "0.25"
    # In production, don't expose Redis to host — internal only
    ports: !reset []
    # Healthcheck with password for prod (requirepass is set in base compose)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    restart: always
    mem_limit: 512m
    cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # ─── Services ──────────────────────────────────────────────────────────────

  core-svc:
    restart: always
    mem_limit: 512m
    cpus: "0.75"
    # In production, core-svc is internal — only gateway exposes it
    ports: !reset []
    env_file:
      - .env
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  taxi-svc:
    restart: always
    mem_limit: 512m
    cpus: "0.75"
    # In production, taxi-svc is internal — only gateway proxies WS
    ports: !reset []
    env_file:
      - .env
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  gateway-api:
    restart: always
    mem_limit: 384m
    cpus: "0.5"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"

  ai-svc:
    restart: always
    mem_limit: 2g      # faster-whisper model requires more RAM
    cpus: "1.5"
    # In production, ai-svc is internal
    ports: !reset []
    env_file:
      - .env
    environment:
      ENV: production
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
