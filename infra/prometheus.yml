global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'core-svc'
    static_configs:
      - targets: ['core-svc:3001']
    metrics_path: /metrics

  - job_name: 'taxi-svc'
    static_configs:
      - targets: ['taxi-svc:3002']
    metrics_path: /metrics

  - job_name: 'gateway-api'
    static_configs:
      - targets: ['gateway-api:3000']
    metrics_path: /metrics

  - job_name: 'ai-svc'
    static_configs:
      - targets: ['ai-svc:8000']
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
