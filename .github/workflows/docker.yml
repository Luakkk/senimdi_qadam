name: Docker — Build & Push

on:
  push:
    branches: [main]
  workflow_dispatch:  # разрешить ручной запуск

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/senimdi-qadam

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: core-svc
            context: services/core-svc
            dockerfile: services/core-svc/Dockerfile
          - service: taxi-svc
            context: services/taxi-svc
            dockerfile: services/taxi-svc/Dockerfile
          - service: gateway-api
            context: services/gateway-api
            dockerfile: services/gateway-api/Dockerfile
          - service: ai-svc
            context: services/ai-svc
            dockerfile: services/ai-svc/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # After all images are pushed — notify Sentry of a new release
  # ────────────────────────────────────────────────────────────────────────────
  sentry-release:
    name: Create Sentry release
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.SENTRY_ORG != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for Sentry commits

      - name: Create Sentry release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: senimdi-qadam
        with:
          environment: production
